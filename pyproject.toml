[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ulead_course"
version = "0.1.0"
description = "Benchmarking parallel computing frameworks across different backends."
readme = "README.md" # Recommended to have a README
requires-python = ">=3.11" # <-- Corrected: This is now a top-level project field

dependencies = [
    "numpy",
    "numba",
    "matplotlib",
    "scipy",
    "jupyter",
    "jupyterlab",
    "ipykernel",
    # Base dependencies for the accelerators
    "dask[complete]",
    "jax[cuda12]",
    "dask-cuda",
    "rapids", # Pinning version for stability in tests
    "cupy-cuda12x",
    "joblib>=1.5.3",
    "opencv-python-headless",
    # Deep learning (CNN bridge + AI model inference)
    "flax",       # Flax NNX for building a small CNN from scratch in JAX
    "timm",       # Pretrained vision models (AlexNet, ResNet, ViT) with ImageNet classes
    "diffusers",  # DDPM inference
    "torch",      # PyTorch backbone for timm/diffusers
    "pypdf>=6.14.2",
    "numpyro>=0.21.0",
]

[tool.jupyter]
lab = "jupyter lab"
